<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sadece Senin İçin ✨</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at bottom, #1b0918 0%, #0d040e 100%);
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    .glow-bg {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 {
      top: 5%;
      left: 10%;
      background: #e056fd;
    }
    .glow-2 {
      bottom: 5%;
      right: 10%;
      background: #ff4757;
    }

    .sparks-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ff9ff3;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff9ff3, 0 0 20px #ff4757;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(29, 9, 26, 0.96) 0%, rgba(10, 3, 11, 0.98) 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    #startOverlay h1 {
      font-family: 'Caveat', cursive;
      font-size: 3.5rem;
      color: #ff9ff3;
      margin-bottom: 25px;
      text-shadow: 0 0 20px rgba(255, 159, 243, 0.4);
    }

    .heart-btn {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 18px 42px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255, 71, 87, 0.45);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: 'Montserrat', sans-serif;
    }

    .heart-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 35px rgba(255, 71, 87, 0.6);
    }

    .heart-btn .icon {
      font-size: 1.4rem;
      display: inline-block;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    .card-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 42px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
    }

    body.card-open .card-container {
      opacity: 1;
      transform: translateY(0);
    }

    .card-text {
      text-align: center;
      padding: 10px 10px 0;
      width: 100%;
    }

    .card-text p {
      font-size: 1.25rem;
      line-height: 1.8;
      color: #f1f2f6;
      font-weight: 300;
      white-space: pre-line;
    }

    .author-name {
      display: block;
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #ff9ff3;
      margin-top: 16px;
      font-weight: 600;
    }

    /* Кнопка ответа и форма */
    .reply-action-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
      gap: 15px;
    }

    .reply-btn {
      background: linear-gradient(135deg, rgba(255, 71, 87, 0.85), rgba(224, 86, 253, 0.85));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      padding: 13px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Montserrat', sans-serif;
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.35);
      transition: all 0.3s ease;
    }

    .reply-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(224, 86, 253, 0.5);
    }

    .reply-form {
      display: none;
      width: 100%;
      max-width: 480px;
      flex-direction: column;
      gap: 14px;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reply-textarea {
      width: 100%;
      height: 110px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 14px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .reply-textarea:focus {
      border-color: #ff9ff3;
      background: rgba(255, 255, 255, 0.12);
    }

    .reply-textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .send-reply-btn {
      align-self: center;
      background: #ff4757;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      padding: 11px 34px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      transition: 0.2s ease;
    }

    .send-reply-btn:hover {
      transform: scale(1.03);
    }

    .reply-success-msg {
      display: none;
      color: #ff9ff3;
      font-size: 1.1rem;
      font-weight: 500;
      text-align: center;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      #startOverlay h1 { font-size: 2.6rem; }
      .heart-btn { padding: 15px 32px; font-size: 1.1rem; }
      .card-container { padding: 28px 18px; border-radius: 22px; }
      .card-text p { font-size: 1.1rem; line-height: 1.6; }
      .author-name { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>
  <div class="sparks-container" id="sparks"></div>

  <!-- Экран заставки -->
  <div id="startOverlay">
    <h1>Senin için... ✨</h1>
    <button class="heart-btn" onclick="openCard()">
      <span class="icon">💌</span> Mesajı Aç
    </button>
  </div>

  <!-- Открытка -->
  <div class="card-container">
    <div class="card-text">
      <p>İstersen şiirler dilinde burada konuşalım,
Я знаю, они у тебя получаются.</p>
      <span class="author-name">— İlyas</span>
    </div>

    <!-- Кнопка и форма ответа -->
    <div class="reply-action-wrap">
      <button class="reply-btn" id="showFormBtn" onclick="toggleReplyForm()">
        ✍️ Cevap ver
      </button>

      <div class="reply-form" id="replyForm">
        <textarea id="replyText" class="reply-textarea" placeholder="Mesajını buraya yazabilirsin..."></textarea>
        <button class="send-reply-btn" id="sendBtn" onclick="sendReply()">Gönder 💌</button>
      </div>

      <div class="reply-success-msg" id="replySuccess">
        Mesajın iletildi... ✨
      </div>
    </div>
  </div>

  <script>
    // === НАСТРОЙКИ TELEGRAM ===
    const TELEGRAM_BOT_TOKEN = "8943235055:AAF1v05Y_Sm1hk5juHj4QegL6bsN0IeDzSM";
    const TELEGRAM_CHAT_ID = "-5443384304";

    // Уведомление о визите на сайт
    async function notifyTelegramVisit() {
      if (sessionStorage.getItem("notified_site2")) return;

      let locationInfo = "Bilinmiyor";
      let ip = "Gizli / Bilinmiyor";

      try {
        const res = await fetch("https://ipapi.co/json/");
        if (res.ok) {
          const data = await res.json();
          ip = data.ip || ip;
          locationInfo = `${data.city || ""}, ${data.country_name || ""}`;
        }
      } catch (e) {}

      const userAgent = navigator.userAgent.includes("Mobile") ? "📱 Телефон" : "💻 Компьютер";
      const now = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

      const text = `🌸 *[САЙТ 2 (БЕЗ ВИДЕО)] Кто-то открыл открытку!* 🌸\n\n` +
                   `🕒 *Время:* ${now}\n` +
                   `📍 *Локация:* ${locationInfo}\n` +
                   `🌐 *IP:* \`${ip}\`\n` +
                   `📱 *Устройство:* ${userAgent}`;

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: text,
            parse_mode: "Markdown"
          })
        });
        sessionStorage.setItem("notified_site2", "true");
      } catch (err) {
        console.error("Bildirim hatası:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", notifyTelegramVisit);

    // Фоновые искры
    const sparksContainer = document.getElementById('sparks');
    for (let i = 0; i < 24; i++) {
      const spark = document.createElement('div');
      spark.className = 'spark';
      spark.style.left = `${Math.random() * 100}vw`;
      spark.style.animationDuration = `${5 + Math.random() * 6}s`;
      spark.style.animationDelay = `${Math.random() * 5}s`;
      spark.style.opacity = Math.random() * 0.7 + 0.3;
      sparksContainer.appendChild(spark);
    }

    function openCard() {
      const overlay = document.getElementById('startOverlay');
      document.body.classList.add('card-open');
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
    }

    // Открытие формы ответа
    function toggleReplyForm() {
      const btn = document.getElementById('showFormBtn');
      const form = document.getElementById('replyForm');
      btn.style.display = 'none';
      form.style.display = 'flex';
      document.getElementById('replyText').focus();
    }

    // Отправка ответа в Telegram
    async function sendReply() {
      const textarea = document.getElementById('replyText');
      const sendBtn = document.getElementById('sendBtn');
      const successMsg = document.getElementById('replySuccess');
      const form = document.getElementById('replyForm');
      const msg = textarea.value.trim();

      if (!msg) return;

      sendBtn.disabled = true;
      sendBtn.innerText = "Gönderiliyor...";

      const text = `💌 *[САЙТ 2 (БЕЗ ВИДЕО)] ОТВЕТ НА ОТКРЫТКУ!*\n\n"${msg}"`;

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: text,
            parse_mode: "Markdown"
          })
        });

        form.style.display = 'none';
        successMsg.style.display = 'block';
      } catch (err) {
        sendBtn.disabled = false;
        sendBtn.innerText = "Gönder 💌";
        alert("Bağlantı hatası, lütfen tekrar deneyin.");
      }
    }
  </script>
</body>
</html>
